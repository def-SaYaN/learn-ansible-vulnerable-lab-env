---
# ---------------------------------------------------------------------------
# Install Active Directory Certificate Services (Enterprise Root CA) on the
# member server. This is the platform the ESC1 bonus chain abuses.
# ---------------------------------------------------------------------------

- name: Install AD CS role + management tools
  ansible.windows.win_feature:
    name:
      - AD-Certificate
      - ADCS-Cert-Authority
      - ADCS-Web-Enrollment
      - RSAT-ADCS
      - RSAT-ADCS-Mgmt
    include_management_tools: true
    state: present
  register: adcs_feature

- name: Configure the Enterprise Root CA
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $params = @{
      CAType              = '{{ adcs_ca_type }}'
      CACommonName        = '{{ adcs_ca_common_name }}'
      KeyLength           = {{ adcs_key_length }}
      HashAlgorithmName   = '{{ adcs_hash }}'
      CryptoProviderName  = 'RSA#Microsoft Software Key Storage Provider'
      ValidityPeriod      = 'Years'
      ValidityPeriodUnits = {{ adcs_validity_years }}
      Force               = $true
    }
    try {
      Install-AdcsCertificationAuthority @params -ErrorAction Stop
      "installed"
    } catch {
      if ($_.Exception.Message -match 'already installed') { "already-installed" }
      else { throw }
    }
  args:
    executable: powershell.exe
  register: ca_config
  changed_when: "'installed' == (ca_config.stdout | trim)"
  failed_when:
    - ca_config.rc != 0
    - "'already' not in ca_config.stdout"

- name: Install the Web Enrollment role service
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'SilentlyContinue'
    Install-AdcsWebEnrollment -Force | Out-Null
    "ok"
  args:
    executable: powershell.exe
  changed_when: false
  failed_when: false

- name: Wait for the CA service (certsvc) to be running
  ansible.windows.win_service:
    name: certsvc
    state: started
    start_mode: auto

- name: Report CA status
  ansible.builtin.debug:
    msg: "AD CS '{{ adcs_ca_common_name }}' state: {{ ca_config.stdout | trim }}"
