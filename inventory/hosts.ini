# ===========================================================================
#  learn-ansible-vulnerable-lab-env  --  static inventory
# ===========================================================================
# The lab lives entirely on the isolated 10.10.10.0/24 host-only network.
# IPs here MUST match the Vagrantfile.  Nothing in this file should ever be
# reachable from a production network or the internet.
# ===========================================================================

[domain_controllers]
dc01 ansible_host=10.10.10.10

[domain_members]
srv01 ansible_host=10.10.10.20   # member server: ADCS CA + SMB file shares
ws01  ansible_host=10.10.10.30   # domain workstation: initial foothold host

[linux_pivot]
pivot ansible_host=10.10.10.5 ansible_connection=ssh ansible_user=vagrant

# ---- roll-ups -------------------------------------------------------------
[windows:children]
domain_controllers
domain_members

[lab:children]
windows
linux_pivot
