---
# ===========================================================================
#  reset.yml - SOFT reset (no VM rebuild).
#
#  Wipes any operator tampering (extra group members, changed passwords,
#  added ACLs on lab objects, the ESC1 template) and re-plants everything
#  from code so the lab is pristine again.
#
#  Run:  ansible-playbook playbooks/reset.yml     (or `make reset-soft`)
#
#  For a guaranteed-clean environment (issued certificates, golden tickets,
#  local artifacts on hosts) use the full rebuild: `make reset`.
# ===========================================================================

- name: Purge planted AD content (users, groups, OUs) on the DC
  hosts: domain_controllers
  gather_facts: false
  tasks:
    - name: Remove lab users
      microsoft.ad.user:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ lab_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove lab groups
      microsoft.ad.group:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ lab_groups }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove the ESC1 certificate template from AD (clears operator ACL edits)
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $rootDSE  = [ADSI]"LDAP://RootDSE"
        $configNC = $rootDSE.configurationNamingContext
        $path = "LDAP://CN={{ lab_adcs.template_name }},CN=Certificate Templates,CN=Public Key Services,CN=Services,$configNC"
        $obj = [ADSI]$path
        if ($obj.Name) { $obj.DeleteTree() ; "deleted" } else { "absent" }
      changed_when: true
      failed_when: false

    - name: Unpublish the ESC1 template from the CA
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        Remove-CATemplate -Name '{{ lab_adcs.template_name }}' -Force
        "ok"
      delegate_to: srv01
      changed_when: true
      failed_when: false

# --- re-plant everything from code -----------------------------------------
- import_playbook: 03-ad-content.yml
- import_playbook: 04-vulns.yml
- import_playbook: 05-adcs.yml
- import_playbook: 06-flags.yml

- name: Reset complete
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Soft reset complete. AD content, vulns, ESC1 template and flags re-planted."
          - "Note: certificates already issued by the CA and any golden tickets survive a soft reset."
          - "For a fully pristine lab run: make reset   (destroys and rebuilds the VMs)."
